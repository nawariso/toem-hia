name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL 18.6 + PostGIS 3.6.4 (stable). Keep identical to infra/docker/compose.yaml.
        image: postgis/postgis:18-3.6-alpine@sha256:ffcf0c4b904e41b9779f8098007fb5a9484025319c18c70cf8e1bcebb742b9b7
        env:
          POSTGRES_USER: toem_hia
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: toem_hia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U toem_hia -d toem_hia_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgres://toem_hia:ci-only-password@localhost:5432/toem_hia_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache-dependency-path: services/api/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with PostgreSQL and race detector
        run: go test -race -count=1 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.3.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo install --check
      - run: npx --yes expo-doctor@1.20.4
      - run: npm audit --audit-level=high
      - name: Type-check shared contracts
        run: ./node_modules/.bin/tsc -p ../../packages/contracts/tsconfig.json
  research-reid:
    # Requirement 004 research pipeline (not product code). Pipeline-correctness
    # tests on synthetic fixtures only; no datasets or model weights in CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/reid
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run toem-reid budget configs/*.json
